<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Основной фавикон (оставляем jpg) -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    
    <!-- Классический favicon.ico для старых браузеров -->
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Фавиконы разных размеров для десктопных и современных браузеров -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- Иконка для устройств Apple (iOS / iPadOS) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Иконки для Android / PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>threeweb</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
